[package]
name = "ctx"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Surgically denied: each catches part of a documented LLM-Rust failure
# category (the post-compiler residue). Named one-by-one on purpose.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_lock = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
cast_ptr_alignment = "deny"
mem_forget = "deny"
rc_buffer = "deny"
