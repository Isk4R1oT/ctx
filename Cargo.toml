[package]
name = "ctx"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream", "http2", "charset", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tiktoken-rs = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Surgically denied: each catches part of a documented LLM-Rust failure
# category (the post-compiler residue). Named one-by-one on purpose.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_lock = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
cast_ptr_alignment = "deny"
mem_forget = "deny"
rc_buffer = "deny"

[dev-dependencies]
insta = { version = "1.47.2", features = ["json", "redactions"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
